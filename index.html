<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空裂 · Web Demo — 第2阶段第1战</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at center, #13132a 0%, #070710 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      color: #ccc;
      overflow: hidden;
    }

    #game-title {
      font-size: 13px;
      color: #556688;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 8px;
      user-select: none;
    }

    #canvas-wrapper {
      /* Subtle perspective for a "board game on table" feeling */
      transform: perspective(1400px) rotateX(6deg);
      transform-origin: center bottom;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(40, 60, 120, 0.25);
      border-radius: 4px;
      overflow: hidden;
    }

    #canvas-wrapper canvas {
      display: block;
    }

    #game-hint {
      margin-top: 10px;
      font-size: 10px;
      color: #334455;
      letter-spacing: 2px;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="game-title">空  裂  ·  KONG LIE</div>

  <div id="canvas-wrapper"></div>

  <div id="game-hint">开战前可拖拽调整阵型 · 满蓝自动释放 W · 点击 R 手动大招 · 15秒后进入加时</div>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

  <!-- Game scripts — order matters (no module system) -->
  <script src="src/data/pieceData.js"></script>
  <script src="src/entities/Piece.js"></script>
  <script src="src/entities/Hero.js"></script>
  <script src="src/systems/BattleSystem.js"></script>
  <script src="src/scenes/BattleScene.js"></script>
  <script src="src/scenes/ResultScene.js"></script>
  <script src="src/main.js"></script>

</body>
</html>
