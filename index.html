<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
        viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>空裂 · Web Demo — 第1阶段战役</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Desktop / base layout ───────────────────────────────────────── */
    body {
      background: #0d0d1a;   /* identical to game bg — seamless letterbox */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      color: #ccc;
      overflow: hidden;
    }

    #game-title {
      font-size: 13px;
      color: #556688;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 8px;
      user-select: none;
    }

    /* Canvas wrapper — desktop: fixed 880×690; mobile: full-screen container.
       Phaser's Scale.FIT letterboxes the game inside it automatically.         */
    #canvas-wrapper {
      width: 880px;
      height: 690px;
      overflow: hidden;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(40, 60, 120, 0.25);
      border-radius: 4px;
      background: #0d0d1a;
    }

    #canvas-wrapper canvas {
      display: block;
      touch-action: none;   /* give all pointer events to Phaser */
    }

    #game-hint {
      margin-top: 10px;
      font-size: 10px;
      color: #334455;
      letter-spacing: 2px;
      user-select: none;
    }

    /* ── Mobile overrides ────────────────────────────────────────────── */
    @media (max-width: 1023px) {
      body {
        /* overflow stays hidden — no native scroll on any page.
           Map/city panning is handled by Phaser camera drag only.          */
        overflow: hidden;
        padding: 0;
        justify-content: center;
        align-items: center;
        background: #0d0d1a;
      }

      /* Title and hint clutter the layout on mobile — hide them. */
      #game-title,
      #game-hint { display: none; }

      /* Canvas wrapper fills 100% of the viewport.
         Phaser Scale.FIT + CENTER_BOTH produces symmetric dark letterboxing. */
      #canvas-wrapper {
        width: 100vw;
        height: 100dvh;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ── Portrait orientation: same as above (already covered) ──────── */

    /* ── Landscape-hint banner (portrait + BattleScene only) ────────── */
    #landscape-hint {
      display: none;   /* JS shows this */
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      background: #11111e;
      color: #5577aa;
      font-size: 11px;
      text-align: center;
      padding: 8px 16px;
      border-bottom: 1px solid #1e2a40;
      user-select: none;
    }
    #landscape-hint button {
      margin-left: 10px;
      background: none;
      border: 1px solid #2a3a55;
      color: #445566;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 3px;
      cursor: pointer;
    }

    /* ── Mobile battle bar (fixed at viewport bottom) ────────────────── */
    #mobile-battle-bar {
      display: none;   /* JS shows this */
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 150;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      background: #09091a;
      border-top: 1px solid #1e1e3a;
    }

    .mb-btn {
      flex: 1;
      max-width: 120px;
      min-height: 48px;
      background: #0e1426;
      color: #7799bb;
      border: 1px solid #2a3a55;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.12s, color 0.12s;
      line-height: 1.3;
      padding: 6px 4px;
    }
    .mb-btn:active          { background: #1a2a44; color: #aaccee; }
    .mb-btn:disabled        { color: #2a3444; border-color: #181e28; cursor: default; }
    .mb-btn.primary         { background: #1a3a66; color: #aad4ff; border-color: #2a5088; }
    .mb-btn.primary:active  { background: #245599; }
    .mb-btn.primary:disabled{ background: #0e1a28; color: #2a3a50; border-color: #1a2030; }
    .mb-btn.danger          { background: #2a1010; color: #774444; border-color: #3a1818; }
    .mb-btn.danger:active   { background: #3a1818; color: #cc4444; }

    /* ── Mobile hero selector (fixed bottom-left on WorldMapScene) ───── */
    #mobile-hero-sel {
      display: none;   /* JS shows this */
      position: fixed;
      bottom: 14px;
      left: 10px;
      z-index: 160;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }
    #mobile-hero-sel .mhs-title {
      font-size: 9px;
      color: #445577;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    #mobile-hero-sel .mhs-row { display: flex; gap: 5px; }
    #mobile-hero-sel .mhs-card {
      width: 46px;
      height: 52px;
      border-radius: 4px;
      border: 1px solid #1a2438;
      background: #080a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    #mobile-hero-sel .mhs-card.unlocked { border-color: #ffd700; background: #100e00; }
    #mobile-hero-sel .mhs-role {
      font-size: 8px;
      font-family: monospace;
      color: #1e2a3a;
    }
    #mobile-hero-sel .mhs-card.unlocked .mhs-role { color: #ffffff; }
    #mobile-hero-sel .mhs-name {
      font-size: 9px;
      color: #1e2a3a;
    }
    #mobile-hero-sel .mhs-card.unlocked .mhs-name { color: #ccddee; }
    #mobile-hero-sel .mhs-badge {
      font-size: 7px;
      color: #1a2030;
    }
    #mobile-hero-sel .mhs-card.unlocked .mhs-badge { color: #44aa55; }
  </style>
</head>
<body>

  <!-- Shows only in portrait while BattleScene is active — one-tap dismiss -->
  <div id="landscape-hint">
    📱 横屏效果更佳
    <button onclick="document.getElementById('landscape-hint').style.display='none'">知道了</button>
  </div>

  <div id="game-title">空  裂  ·  KONG LIE</div>

  <div id="canvas-wrapper"></div>

  <div id="game-hint">开战前可拖拽调整阵型 · 满蓝自动释放 W · 点击 R 手动大招 · 30秒后进入加时</div>

  <!-- Mobile battle controls — fixed at viewport bottom, only during BattleScene -->
  <div id="mobile-battle-bar">
    <button class="mb-btn danger"  id="mb-abort"
      onclick="MobileUtil._mobileAbort()">中止战役</button>
    <button class="mb-btn primary" id="mb-start"
      onclick="MobileUtil._mobileStart()">▶ 开战</button>
    <button class="mb-btn"         id="mb-pause"
      onclick="MobileUtil._mobilePause()" disabled>⏸ 暂停</button>
  </div>

  <!-- Mobile hero selector — fixed bottom-left, only during WorldMapScene -->
  <div id="mobile-hero-sel">
    <div class="mhs-title">英 雄 选 择</div>
    <div class="mhs-row">
      <div class="mhs-card unlocked">
        <span class="mhs-role">FTR</span>
        <span class="mhs-name">西德尼</span>
        <span class="mhs-badge">✓</span>
      </div>
      <div class="mhs-card">
        <span class="mhs-role">TANK</span>
        <span class="mhs-name">布鲁</span>
        <span class="mhs-badge">锁</span>
      </div>
      <div class="mhs-card">
        <span class="mhs-role">???</span>
        <span class="mhs-name">?</span>
        <span class="mhs-badge">锁</span>
      </div>
      <div class="mhs-card">
        <span class="mhs-role">???</span>
        <span class="mhs-name">?</span>
        <span class="mhs-badge">锁</span>
      </div>
    </div>
  </div>

  <!-- Ensure Phaser's loop runs even when the tab is hidden / unfocused -->
  <script>
    try {
      Object.defineProperty(document, 'hidden',          { get: () => false,     configurable: true });
      Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
      document.dispatchEvent(new Event('visibilitychange'));
    } catch(e) {}
    try {
      window.dispatchEvent(new FocusEvent('focus'));
      setInterval(() => window.dispatchEvent(new FocusEvent('focus')), 1000);
    } catch(e) {}
  </script>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

  <!-- ?v=4 busts cache after this mobile-ui revision -->
  <script src="src/utils/MobileUtil.js?v=4"></script>
  <script src="src/utils/autoPlacement.js?v=4"></script>
  <script src="src/systems/CampaignState.js?v=4"></script>
  <script src="src/data/pieceData.js?v=4"></script>
  <script src="src/data/campaignData.js?v=4"></script>
  <script src="src/data/synergyData.js?v=4"></script>
  <script src="src/entities/Piece.js?v=4"></script>
  <script src="src/entities/Hero.js?v=4"></script>
  <script src="src/systems/BattleSystem.js?v=4"></script>
  <script src="src/scenes/WorldMapScene.js?v=4"></script>
  <script src="src/scenes/CityScene.js?v=4"></script>
  <script src="src/scenes/CampaignStartScene.js?v=4"></script>
  <script src="src/scenes/CampaignMapScene.js?v=4"></script>
  <script src="src/scenes/BetweenBattleScene.js?v=4"></script>
  <script src="src/scenes/CampaignEndScene.js?v=4"></script>
  <script src="src/scenes/BattleScene.js?v=4"></script>
  <script src="src/scenes/ResultScene.js?v=4"></script>
  <script src="src/main.js?v=4"></script>

</body>
</html>
